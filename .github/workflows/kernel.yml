name: COXVBN kernel

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  aarch64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: Build kernel
        run: make clean all
      - name: Verify image format
        run: |
          aarch64-linux-gnu-readelf -h build/coxvbn.elf | grep -E 'Machine:.*AArch64'
          test -s build/coxvbn.bin
      - name: QEMU serial boot test
        run: |
          set +e
          timeout 8s qemu-system-aarch64 -M virt -cpu cortex-a57 -nographic -monitor none -serial stdio -kernel build/coxvbn.bin > qemu.log 2>&1
          status=$?
          set -e
          cat qemu.log
          grep -q "COXVBN: kernel online" qemu.log
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            exit "$status"
          fi
