name: COXVBN kernel
on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  aarch64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: Host FDT parser tests
        run: make test-host
      - name: Build kernel
        run: make clean all
      - name: Verify image format
        run: |
          aarch64-linux-gnu-readelf -h build/coxvbn.elf | grep -E 'Machine:.*AArch64'
          test -s build/coxvbn.bin
      - name: Verify exception vector table
        run: |
          aarch64-linux-gnu-nm build/coxvbn.elf | grep -q ' __exception_vectors$'
          aarch64-linux-gnu-objdump -d build/coxvbn.elf | grep -q 'msr[[:space:]]*VBAR_EL1'
      - name: QEMU serial boot test
        run: |
          set +e
          timeout 15s qemu-system-aarch64 -M virt -cpu cortex-a57 -nographic -monitor none -serial stdio -kernel build/coxvbn.bin -d int -D qemu-int.log > qemu.log 2>&1
          status=$?
          set -e
          cat qemu.log
          if [ -f qemu-int.log ]; then tail -n 120 qemu-int.log; fi
          grep -q "COXVBN: UART READY" qemu.log
          grep -q "COXVBN: FDT PARSED" qemu.log
          grep -q "COXVBN: MEMORY DISCOVERY READY" qemu.log
          grep -q "COXVBN: BOOT COMPLETE" qemu.log
          grep -Eq "COXVBN: RAM regions 0x[1-9a-f][0-9a-f]*" qemu.log
          if grep -q "ELR 0x200" qemu-int.log; then
            echo "Unexpected exception vector at address 0x200"
            exit 1
          fi
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then exit "$status"; fi
